name: Build

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew test

  release:
    needs: test
    if: github.event_name != 'pull_request' && github.repository == 'mytv-android/myEarthquakeAlert'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Add signing files
        env:
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
        run: |
          if [ -n "$SIGN_KEY" ]; then
            echo "$SIGN_KEY" | base64 -d > keystore.jks
          elif [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          fi
          if [ -n "$SIGNING_PROPERTIES" ]; then
            echo "$SIGNING_PROPERTIES" | base64 -d > signing.properties
          elif [ -n "$KEYSTORE_PASSWORD" ]; then
            {
              echo "storeFile=keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_ALIAS_PASSWORD"
            } > signing.properties
          fi
          if [ ! -s keystore.jks ]; then
            echo "::error::缺少签名密钥，请配置 SIGN_KEY 或 KEYSTORE_BASE64 secrets"
            exit 1
          fi
      - name: Build release
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon --max-workers=1 -Porg.gradle.jvmargs=-Xmx3g
      - name: Prepare release assets
        id: apk
        run: |
          set -euo pipefail
          # Phone APK: only the :app release output (a :wear module builds its own APK).
          phone_dir=app/build/outputs/apk/release
          metadata="$phone_dir/output-metadata.json"
          version=$(jq -r '.elements[0].versionName' "$metadata")
          code=$(jq -r '.elements[0].versionCode' "$metadata")
          # versionName 固定为 1.0，标签带上 versionCode（运行号），每次构建的发布互不覆盖
          tag="v${version}.${code}"
          mkdir -p dist
          mapfile -t phone_apks < <(find "$phone_dir" -maxdepth 1 -name '*.apk' | sort)
          if [ "${#phone_apks[@]}" -ne 1 ]; then
            echo "::error::期望 $phone_dir 下恰好一个 APK，实际 ${#phone_apks[@]} 个"
            exit 1
          fi
          cp "${phone_apks[0]}" dist/
          apk_name=$(basename "${phone_apks[0]}")
          apk="dist/$apk_name"
          sha=$(sha256sum "$apk" | awk '{print $1}')
          size=$(stat -c%s "$apk")
          published=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          channel=$([ "$GITHUB_REF_NAME" = "master" ] && echo "stable" || echo "dev")
          note=$(git log -1 --pretty=%s)
          download="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          # 应用内更新先找 <apk>.sha256，旧版本客户端与回退路径读 update.apk.sha256
          echo "$sha  $apk_name" > "dist/$apk_name.sha256"
          echo "$sha  $apk_name" > dist/update.apk.sha256
          # Watch APK, when a :wear module was built.
          wear='null'
          wear_apk=$(find wear/build/outputs/apk/release -maxdepth 1 -name '*.apk' 2>/dev/null | sort | head -1 || true)
          if [ -n "$wear_apk" ]; then
            wear_name="myEarthquakeAlert-wear-${version}.${code}.apk"
            cp "$wear_apk" "dist/$wear_name"
            wear_sha=$(sha256sum "dist/$wear_name" | awk '{print $1}')
            wear_size=$(stat -c%s "dist/$wear_name")
            echo "$wear_sha  $wear_name" > "dist/$wear_name.sha256"
            wear=$(jq -n --arg url "$download/$wear_name" --argjson size "$wear_size" --arg sha "$wear_sha" '{url:$url,size:$size,sha256:$sha}')
          fi
          jq -n             --arg schema "myearthquakealert.update"             --arg channel "$channel"             --argjson versionCode "$code"             --arg versionName "$version"             --arg tag "$tag"             --arg publishedAt "$published"             --arg url "$download/$apk_name"             --argjson size "$size"             --arg sha "$sha"             --arg note "$note"             --argjson wear "$wear"             '{schema:$schema,channel:$channel,versionCode:$versionCode,versionName:$versionName,tag:$tag,publishedAt:$publishedAt,minSdk:23,apk:{url:$url,size:$size,sha256:$sha},notes:[$note]}
             + (if $wear == null then {} else {wear:$wear} end)' > dist/update.json
          ls -l dist
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: myEarthQuakeAlert ${{ steps.apk.outputs.version }} (${{ steps.apk.outputs.code }})
          body: Android 6.0+ 通用安装包。versionCode ${{ steps.apk.outputs.code }}。应用内更新会读取 update.json 并校验 SHA-256 与签名；附带手表 APK 时文件名为 myEarthquakeAlert-wear-*.apk。
          files: |
            dist/*.apk
            dist/*.sha256
            dist/update.json
          prerelease: ${{ github.ref_name != 'master' }}
          make_latest: ${{ github.ref_name == 'master' && 'true' || 'false' }}
